name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - id: generate
        uses: mmastrac/mmm-matrix@v1
        with:
          input: |
            rust-toolchain: stable
            job: [test]
            feature_combo: [default, all-features, no-default-features]
            cargo_args:
              $match:
                "this.feature_combo == 'default'": ""
                "this.feature_combo == 'all-features'": "--all-features"
                "this.feature_combo == 'no-default-features'": "--no-default-features"
            label:
              linux:
                os: ubuntu-latest
              macos:
                os: macos-latest
              windows:
                os: windows-latest
          config: |
            github: ${{ toJSON(github) }}

  test:
    name: ${{ matrix.label }} / ${{ matrix.job }} / ${{ matrix.feature_combo }} (${{ matrix.rust-toolchain }})
    runs-on: ${{ matrix.os }}
    needs: generate-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain (${{ matrix.rust-toolchain }})
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust-toolchain }}
          components: clippy

      - name: Install wget (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: |
          choco install -y wget
          wget --version

      - name: Install pwsh (Linux, best-effort)
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          # Ubuntu images may already include pwsh; if not, try installing via apt.
          # If the package isn't available, continue without failing the job.
          sudo apt-get install -y powershell || true
          command -v pwsh >/dev/null 2>&1 && pwsh -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion' || true

      - name: Run clippy (${{ matrix.feature_combo }})
        shell: bash
        run: cargo clippy ${{ matrix.cargo_args }} -- -D warnings

      - name: Run tests (${{ matrix.feature_combo }})
        shell: bash
        run: cargo test ${{ matrix.cargo_args }}
