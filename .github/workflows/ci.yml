name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - id: generate
        uses: mmastrac/mmm-matrix@v1
        with:
          input: |
            rust-toolchain: stable
            job: [test]
            feature_combo: [default, all-features, no-default-features]
            cargo_args:
              $match:
                "this.feature_combo == 'default'": ""
                "this.feature_combo == 'all-features'": "--all-features"
                "this.feature_combo == 'no-default-features'": "--no-default-features"
            label:
              linux:
                os: ubuntu-latest
              macos:
                os: macos-latest
              windows:
                os: windows-latest
          config: |
            github: ${{ toJSON(github) }}

  test:
    name: ${{ matrix.label }} / ${{ matrix.job }} / ${{ matrix.feature_combo }} (${{ matrix.rust-toolchain }})
    runs-on: ${{ matrix.os }}
    needs: generate-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain (${{ matrix.rust-toolchain }})
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust-toolchain }}
          components: clippy

      - name: Install wget (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: |
          choco install -y wget
          wget --version

      - name: Install pwsh (Linux, best-effort)
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          # Ubuntu images may already include pwsh; if not, try installing via apt.
          # If the package isn't available, continue without failing the job.
          sudo apt-get install -y powershell || true
          command -v pwsh >/dev/null 2>&1 && pwsh -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion' || true

      - name: Start httpbin (Docker)
        shell: bash
        run: |
          set -euo pipefail
          PORT=8080
          IMAGE=kennethreitz/httpbin:latest
          if ! command -v docker >/dev/null 2>&1; then
            echo "SHELL_DOWNLOAD_HTTPBIN=https://httpbin.org" >> "$GITHUB_ENV"
            echo "Docker not found; falling back to public httpbin"
            exit 0
          fi
          # Linux image: use linux/amd64 everywhere (GitHub runners; arm64 hosts via emulation).
          # Docker Desktop on Windows must use "Linux containers", not Windows containers, or pull fails with:
          #   image operating system "linux" cannot be used on this platform
          docker pull --platform linux/amd64 "$IMAGE"
          docker rm -f shell-download-httpbin 2>/dev/null || true
          docker run -d --name shell-download-httpbin --rm --platform linux/amd64 -p "127.0.0.1:${PORT}:80" "$IMAGE"
          echo "SHELL_DOWNLOAD_HTTPBIN=http://127.0.0.1:${PORT}" >> "$GITHUB_ENV"
          for _ in $(seq 1 60); do
            if curl -sfS "http://127.0.0.1:${PORT}/get" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "httpbin did not become ready in time" >&2
          docker logs shell-download-httpbin 2>&1 || true
          exit 1

      - name: Run clippy (${{ matrix.feature_combo }})
        shell: bash
        run: cargo clippy ${{ matrix.cargo_args }} -- -D warnings

      - name: Run tests (${{ matrix.feature_combo }})
        shell: bash
        run: cargo test ${{ matrix.cargo_args }}
