[package]
name = "shell-download"
version = "0.21.0"
edition = "2024"
authors = ["Matt Mastracci <matthew@mastracci.com>"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/mmastrac/shell-download"
readme = "README.md"
categories = ["network-programming", "command-line-utilities", "os"]
rust-version = "1.87"
description = "Zero-dependency Rust library for downloading a remote URL to a file, string or bytes using commonly-available shell tools."

[lib]
path = "src/lib.rs"

[[bin]]
name = "shell-download"
path = "src/main.rs"

[features]
default = []
url = ["dep:url"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
debug = false
strip = "symbols"

[dependencies]
url = { version = "2.5", optional = true, default-features = false }

[dev-dependencies]
dtor = "1.0.1"
serde_json = "1"
